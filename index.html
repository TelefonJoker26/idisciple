<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>iDisciple</title>
<style>
:root{
  --bg:#f6f4ee;
  --surface:#ffffff;
  --surface-2:#eeece2;
  --ink:#22301f;
  --ink-dim:#5c6b57;
  --line:#d9d4c4;
  --accent:#3f6b4a;
  --accent-ink:#ffffff;
  --gold:#b9873a;
  --gold-soft:#f1e3c8;
  --learn:#3f6b4a;
  --practice:#8a6a2f;
  --character:#5a4a8a;
  --learn-bg:#e7efe6;
  --practice-bg:#f3ead6;
  --character-bg:#ece8f5;
  --shadow: 0 1px 2px rgba(30,30,20,0.06), 0 6px 20px rgba(30,30,20,0.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a14;
    --surface:#1f251c;
    --surface-2:#242a1f;
    --ink:#e9ecE3;
    --ink-dim:#a6b09d;
    --line:#333b2c;
    --accent:#7fb388;
    --accent-ink:#12180f;
    --gold:#e0b567;
    --gold-soft:#3a331f;
    --learn:#7fb388;
    --practice:#e0b567;
    --character:#b3a3e6;
    --learn-bg:#20281f;
    --practice-bg:#2b2519;
    --character-bg:#241f30;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#161a14;
  --surface:#1f251c;
  --surface-2:#242a1f;
  --ink:#e9ecE3;
  --ink-dim:#a6b09d;
  --line:#333b2c;
  --accent:#7fb388;
  --accent-ink:#12180f;
  --gold:#e0b567;
  --gold-soft:#3a331f;
  --learn:#7fb388;
  --practice:#e0b567;
  --character:#b3a3e6;
  --learn-bg:#20281f;
  --practice-bg:#2b2519;
  --character-bg:#241f30;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Karla', -apple-system, BlinkMacSystemFont, sans-serif;
  padding:0 16px;
  padding-block:28px 60px;
}
h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; }
.wrap{ max-width:980px; margin:0 auto; }

.lang-row{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.lang-btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-dim);
  font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
  box-shadow:var(--shadow);
}
.lang-btn span.flag{ font-size:15px; line-height:1; }
.lang-btn:hover{ background:var(--surface-2); }
.lang-btn.active{ background:var(--gold-soft); color:var(--ink); border-color:var(--gold); }

/* Farsi reads right-to-left; keep the language switcher itself always left-to-right
   (flag + code order stays readable) but mirror the main text content. */
:root[dir="rtl"] .lede,
:root[dir="rtl"] .overview-hint,
:root[dir="rtl"] footer.note,
:root[dir="rtl"] .next-card .division,
:root[dir="rtl"] .next-card .item-title,
:root[dir="rtl"] .res-line,
:root[dir="rtl"] .item-title-row,
:root[dir="rtl"] .stage-name,
:root[dir="rtl"] .record-card label,
:root[dir="rtl"] input,
:root[dir="rtl"] textarea{ direction:rtl; text-align:right; }
:root[dir="rtl"] .lang-row{ direction:ltr; }
:root[dir="rtl"] .next-card .done-check{ direction:rtl; }

header.top{ margin-bottom:28px; }
.header-row{ display:flex; align-items:flex-start; gap:26px; flex-wrap:wrap; }
.intro{ flex:1 1 380px; min-width:0; }
.eyebrow{
  font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:6px;
}
h1{ font-size:clamp(28px,5vw,40px); font-weight:600; margin:0 0 10px; text-wrap:balance; }
.lede{ color:var(--ink-dim); font-size:15.5px; line-height:1.6; max-width:62ch; }
.lede b{ color:var(--ink); font-weight:600; }

/* Session record card */
.record-card{
  flex:0 0 260px; width:260px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;
}
@media (max-width:760px){ .record-card{ flex:1 1 100%; width:100%; } }
.record-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:10px; }
.record-card label{
  display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-dim); font-weight:700; margin-top:10px;
}
.record-card label:first-of-type{ margin-top:0; }
.record-card input, .record-card textarea{
  display:block; width:100%; margin-top:4px; font-family:'Karla',sans-serif; font-size:13.5px;
  padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg);
  color:var(--ink);
}
.record-card textarea{ min-height:58px; resize:vertical; font-family:inherit; line-height:1.4; }
.record-card input:focus, .record-card textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.print-btn{
  margin-top:14px; width:100%; padding:10px 12px; border:none; border-radius:9px;
  background:var(--accent); color:var(--accent-ink); font-family:'Karla',sans-serif; font-weight:700;
  font-size:13.5px; cursor:pointer;
}
.print-btn:hover{ filter:brightness(1.08); }
.print-btn:disabled{ opacity:.6; cursor:default; }
.print-status{ margin-top:8px; font-size:12px; color:var(--ink-dim); min-height:14px; }
.print-status.error{ color:#b0432f; }

@media print{
  .print-btn{ display:none !important; }
  body{ background:#fff; padding:0; }
  *{ box-shadow:none !important; color-adjust:exact; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .col, .next-card, .item, tr{ break-inside:avoid; }
  .record-card{ border:1px solid #999; }
  .stage-ring{ display:none; }
}

/* Path / stage selector */
.path{
  display:flex; gap:0; margin:28px 0 22px; position:relative;
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); box-shadow:var(--shadow); overflow:hidden;
}
.stage-btn{
  flex:1; min-width:0; padding:14px 10px; text-align:center; cursor:pointer;
  background:transparent; border:none; border-right:1px solid var(--line);
  font-family:'Karla',sans-serif; color:var(--ink-dim);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:background .15s ease;
}
.stage-btn:last-child{ border-right:none; }
.stage-btn:hover{ background:var(--surface-2); }
.stage-btn.active{ background:var(--gold-soft); color:var(--ink); }
.stage-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
.stage-ring{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-variant-numeric:tabular-nums;
  background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--line) 0);
}
.stage-ring::after{
  content:attr(data-pct)"%"; width:26px; height:26px; border-radius:50%;
  background:var(--surface); display:flex; align-items:center; justify-content:center;
}
.stage-btn.active .stage-ring::after{ background:var(--gold-soft); }

/* Next steps */
.next-steps{ margin-bottom:30px; }
.section-title{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); font-weight:700; margin:0 0 12px; }
.next-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:760px){ .next-grid{ grid-template-columns:1fr; } }
.next-card{
  border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
  border:1px solid var(--line); background:var(--surface);
  border-top:4px solid var(--card-color);
}
.next-card .division{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--card-color); margin-bottom:6px; }
.next-card .item-title{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 10px; }
.next-card .res{ font-size:13px; color:var(--ink-dim); line-height:1.55; }
.next-card .res b{ color:var(--ink); font-weight:600; }
.next-card .done-check{ display:inline-flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; cursor:pointer; user-select:none; }
.next-card.all-done{ display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-dim); font-size:14px; padding:26px 16px; }

/* Columns */
.columns{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start; }
@media (max-width:760px){ .columns{ grid-template-columns:1fr; } }
.col{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.col-head{ padding:14px 16px; border-bottom:1px solid var(--line); }
.col-head .label{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.col-head .sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
.col.learn .col-head{ background:var(--learn-bg); }
.col.practice .col-head{ background:var(--practice-bg); }
.col.character .col-head{ background:var(--character-bg); }
.col-body{ padding:6px 8px; }

.item{ border-bottom:1px solid var(--line); }
.item:last-child{ border-bottom:none; }
.item-row{
  display:flex; align-items:flex-start; gap:10px; padding:10px 8px; cursor:pointer;
}
.item-row:hover{ background:var(--surface-2); }
.chk{
  margin-top:2px; width:18px; height:18px; flex:none; border-radius:5px;
  border:2px solid var(--line); appearance:none; cursor:pointer; position:relative;
  background:var(--surface);
}
.chk:checked{ background:var(--accent); border-color:var(--accent); }
.chk:checked::after{
  content:""; position:absolute; left:4px; top:0px; width:5px; height:10px;
  border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(45deg);
}
.item-title-row{ flex:1; font-size:14.5px; line-height:1.4; }
.item.checked .item-title-row{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }
.caret{ font-size:11px; color:var(--ink-dim); transition:transform .15s ease; margin-top:3px; }
.item.open .caret{ transform:rotate(90deg); }
.item-detail{ display:none; padding:0 10px 12px 36px; font-size:13px; color:var(--ink-dim); line-height:1.6; }
.item.open .item-detail{ display:block; }
.item-detail .res-line{ margin-bottom:6px; }
.item-detail b{ color:var(--ink); font-weight:600; }
.tbd{ font-style:italic; opacity:.85; }
.res-line a{ color:var(--accent); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px; }
.res-line a:hover{ text-decoration-color:var(--accent); }
.next-card .res-line a{ color:inherit; font-weight:600; }

footer.note{ margin-top:36px; font-size:12.5px; color:var(--ink-dim); line-height:1.7; border-top:1px solid var(--line); padding-top:18px; }
footer.note b{ color:var(--ink); }

/* Overview */
.overview-wrap{ margin-bottom:34px; }
.overview-hint{ font-size:12.5px; color:var(--ink-dim); margin:-6px 0 12px; }
.table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); background:var(--surface); }
.overview-table{ border-collapse:collapse; width:100%; min-width:680px; }
.overview-table th, .overview-table td{ border:1px solid var(--line); padding:10px 12px; vertical-align:top; text-align:left; }
.overview-table thead th{ background:var(--surface-2); font-family:'Fraunces',serif; font-weight:600; font-size:14px; cursor:pointer; }
.overview-table thead th.corner{ background:var(--surface); cursor:default; }
.overview-table thead th:not(.corner):hover{ background:var(--gold-soft); }
.overview-table .row-label{ font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; white-space:nowrap; background:var(--surface-2); }
.overview-table td{ font-size:12.5px; }
.mini-item{ display:flex; align-items:flex-start; gap:6px; padding:3px 0; cursor:pointer; line-height:1.35; }
.mini-item input{ margin-top:2px; width:13px; height:13px; flex:none; }
.mini-item.checked span{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }

/* View tabs (Pathway | Courses) */
[hidden]{ display:none !important; }
.view-tabs{
  display:inline-flex; gap:0; margin:0 0 22px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); box-shadow:var(--shadow); overflow:hidden;
}
.view-tabs button{
  padding:9px 22px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer;
  font-family:'Fraunces',serif; font-weight:600; font-size:15px;
}
.view-tabs button + button{ border-inline-start:1px solid var(--line); }
.view-tabs button:hover{ background:var(--surface-2); }
.view-tabs button.active{ background:var(--gold-soft); color:var(--ink); }

/* Course library */
.course-controls{ display:flex; flex-direction:column; gap:8px; margin:0 0 18px; }
.frow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.flabel{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--ink-dim); min-width:92px; }
.fchip{
  padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-dim); font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
}
.fchip:hover{ background:var(--surface-2); }
.fchip.active{ background:var(--gold-soft); color:var(--ink); border-color:var(--gold); }
.msel{
  padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font-family:'Karla',sans-serif; font-size:13px;
}
.item-banner{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 14px; border:1px solid var(--gold); background:var(--gold-soft); border-radius:var(--radius);
  font-weight:700; font-size:14px;
}
.course-list{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
.no-courses{ padding:26px 16px; text-align:center; color:var(--ink-dim); border:1px dashed var(--line); border-radius:var(--radius); }
.course-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px; min-width:0;
}
.course-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.course-id{ flex:1 1 300px; min-width:0; }
.course-card h3{ font-size:19px; font-weight:600; margin:0 0 3px; }
.course-by{ font-size:12.5px; color:var(--ink-dim); }
.course-langs{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.course-langs .avail{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); font-weight:700; margin-inline-end:2px; }
.lchip{
  display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:700;
  border:1px solid var(--accent); color:var(--ink);
}
.lchip.part{ border-style:dashed; color:var(--ink-dim); border-color:var(--line); }
.lchip.eff{ background:var(--gold-soft); border-color:var(--gold); }
.lchip .flag{ font-size:13px; line-height:1; }
.lang-warn{
  margin-top:10px; padding:7px 10px; border-radius:8px; background:var(--gold-soft); font-size:12.5px; color:var(--ink);
}
.course-blurb{ margin:10px 0 14px; font-size:14px; line-height:1.6; color:var(--ink-dim); max-width:80ch; }

.cov-wrap{ overflow-x:auto; }
.cov-grid{ border-collapse:separate; border-spacing:4px; direction:ltr; min-width:300px; }
.cov-grid th{ font-size:11.5px; font-weight:700; color:var(--ink-dim); text-align:center; padding:2px 4px; }
.cov-grid th.cov-row{ text-align:start; font-family:'Fraunces',serif; font-size:13px; white-space:nowrap; padding-inline-end:8px; }
.cov-cell{
  position:relative; overflow:hidden; display:block; width:100%; min-width:54px; height:38px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface-2);
  color:var(--ink); font-family:'Karla',sans-serif; font-size:13px; cursor:pointer; padding:0;
}
.cov-cell::before{
  content:""; position:absolute; inset:0; background:var(--cell-color);
  opacity:calc(var(--f) * .5);
}
.cov-cell b, .cov-cell span{ position:relative; }
.cov-cell span{ color:var(--ink-dim); font-size:11px; }
.cov-cell:not(.empty){ border-color:var(--cell-color); }
.cov-cell.empty{ opacity:.55; cursor:default; }
.cov-cell.sel{ outline:2px solid var(--ink); outline-offset:1px; }
.cov-cell.hl{ box-shadow:0 0 0 2px var(--gold); }
.cov-summary{ margin-top:8px; font-size:13px; color:var(--ink-dim); }
.cov-summary b{ color:var(--ink); }

.cell-detail{ margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:13px; }
.cell-detail-title{ font-family:'Fraunces',serif; font-weight:600; margin-bottom:6px; }
.cell-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.cell-list li{ display:flex; align-items:baseline; gap:8px; }
.cell-list .tick{ width:14px; color:var(--accent); font-weight:700; flex:none; }
.cell-list li.done .ct{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }
.cov-sess{ color:var(--ink-dim); font-size:12px; }
.cell-miss{ margin-top:8px; color:var(--ink-dim); font-size:12.5px; line-height:1.5; }
.cell-miss b{ color:var(--ink); font-weight:600; }

.sess-toggle{
  margin-top:12px; display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
  font-family:'Karla',sans-serif; font-weight:700; font-size:13px;
}
.sess-toggle:hover{ background:var(--surface-2); }
.sess-toggle .caret{ margin-top:0; transition:transform .15s ease; }
.sess-toggle[aria-expanded="true"] .caret{ transform:rotate(90deg); }
.sess-wrap{ margin-top:10px; }
.sess-group{ font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; margin:14px 0 4px; color:var(--ink); }
.sess-list{ list-style:none; margin:0; padding:0; }
.sess{ display:flex; gap:10px; padding:6px 4px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.4; }
.sess:first-child{ border-top:none; }
.sess.hit{ background:var(--gold-soft); border-radius:6px; }
.sn{ flex:0 0 58px; color:var(--ink-dim); font-size:12px; font-variant-numeric:tabular-nums; padding-top:1px; }
.sbody{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.sbody a{ color:var(--accent); font-weight:600; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px; }
.sbody a:hover{ text-decoration-color:var(--accent); }
.nofile{ color:var(--ink-dim); }
.pg{ color:var(--ink-dim); font-size:12px; }
.sitems{ font-size:12px; color:var(--ink-dim); }
.lang-badge{
  display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:6px;
  background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line); vertical-align:1px;
}
.lang-badge.off{ border-style:dashed; }
.cc-btn{
  display:inline-block; margin-top:6px; padding:0; border:none; background:none; cursor:pointer;
  color:var(--accent); font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px; text-decoration:underline;
  text-decoration-color:var(--line); text-underline-offset:2px;
}
.cc-btn:hover{ text-decoration-color:var(--accent); }
.next-card .cc-btn{ display:block; color:inherit; }
:root[dir="rtl"] .course-blurb,
:root[dir="rtl"] .course-by,
:root[dir="rtl"] .cov-summary,
:root[dir="rtl"] .cell-detail,
:root[dir="rtl"] .lang-warn,
:root[dir="rtl"] .item-banner,
:root[dir="rtl"] .flabel,
:root[dir="rtl"] .sess-toggle,
:root[dir="rtl"] .view-tabs button{ direction:rtl; text-align:right; }
:root[dir="rtl"] .view-tabs{ direction:ltr; }
@media (max-width:760px){ .flabel{ min-width:100%; } .sn{ flex-basis:46px; } }
@media print{ .view-tabs{ display:none !important; } }

/* Show-me-around tour */
.lang-row{ align-items:center; }
.tour-btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
  border:1px solid var(--accent); background:var(--surface); color:var(--accent);
  font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; box-shadow:var(--shadow);

    en:'A map of spiritual growth from new life in Christ to leadership, in three areas — <b>Knowing</b> (doctrine), <b>Doing</b> (conduct), and <b>Being</b> (character) — drawn from the qualifications of an elder in 1&nbsp;Timothy&nbsp;3 and Titus&nbsp;1. Though written for overseers, these areas of growth apply to every believer, women included. Check off what’s already true of you or the person you’re discipling, and your next steps — with resources for each — will surface automatically.',
    uk:'Карта духовного зростання від нового життя в Христі до лідерства, у трьох сферах — <b>Знання</b> (вчення), <b>Дії</b> (поведінка) та <b>Буття</b> (характер) — складена на основі вимог до старійшини в 1&nbsp;Тимофія&nbsp;3 та Титу&nbsp;1. Хоча ці вимоги написані для єпископів (наглядачів), ці сфери зростання стосуються кожного віруючого, включно з жінками. Познач те, що вже є правдою про тебе або про людину, яку ти наставляєш, — і твої наступні кроки з відповідними ресурсами з’являться автоматично.',
    de:'Eine Landkarte geistlichen Wachstums von der Neugeburt in Christus bis zur Leiterschaft, in drei Bereichen — <b>Wissen</b> (Lehre), <b>Handeln</b> (Wandel) und <b>Sein</b> (Charakter) — abgeleitet aus den Anforderungen an einen Ältesten in 1.&nbsp;Timotheus&nbsp;3 und Titus&nbsp;1. Obwohl für Aufseher geschrieben, gelten diese Wachstumsbereiche für jeden Gläubigen, auch für Frauen. Hake ab, was bei dir oder der Person, die du jüngerst, bereits zutrifft — deine nächsten Schritte samt passenden Ressourcen erscheinen dann automatisch.',
    es:'Un mapa del crecimiento espiritual desde el nuevo nacimiento en Cristo hasta el liderazgo, en tres áreas — <b>Saber</b> (doctrina), <b>Hacer</b> (conducta) y <b>Ser</b> (carácter) — tomadas de los requisitos de un anciano en 1&nbsp;Timoteo&nbsp;3 y Tito&nbsp;1. Aunque se escribieron para los ancianos/obispos, estas áreas de crecimiento aplican a todo creyente, incluidas las mujeres. Marca lo que ya es cierto de ti o de la persona que estás discipulando, y tus próximos pasos — con recursos para cada uno — aparecerán automáticamente.',
    it:'Una mappa della crescita spirituale dalla nuova nascita in Cristo fino alla leadership, in tre aree — <b>Sapere</b> (dottrina), <b>Fare</b> (condotta) ed <b>Essere</b> (carattere) — tratte dai requisiti per un anziano in 1&nbsp;Timoteo&nbsp;3 e Tito&nbsp;1. Sebbene scritte per i sovrintendenti, queste aree di crescita si applicano a ogni credente, comprese le donne. Spunta ciò che è già vero di te o della persona che stai discepolando: i tuoi prossimi passi, con le relative risorse, appariranno automaticamente.',
    pl:'Mapa duchowego wzrostu od nowego życia w Chrystusie aż do przywództwa, w trzech obszarach — <b>Wiedza</b> (doktryna), <b>Działanie</b> (postępowanie) i <b>Bycie</b> (charakter) — oparta na wymaganiach stawianych starszemu w 1&nbsp;Tymoteusza&nbsp;3 i Tytusa&nbsp;1. Choć napisane dla biskupów (nadzorców), te obszary wzrostu dotyczą każdego wierzącego, w tym kobiet. Zaznacz, co jest już prawdą o tobie lub o osobie, którą dyscyplinujesz, a twoje kolejne kroki — wraz z materiałami do każdego z nich — pojawią się automatycznie.',
    fa:'نقشه‌ای از رشد روحانی، از تولد تازه در مسیح تا رهبری، در سه حوزه — <b>شناخت</b> (تعلیم)، <b>عمل</b> (رفتار) و <b>بودن</b> (شخصیت) — برگرفته از شرایط لازم برای یک شیخ (ناظر) در رساله اول تیموتائوس&nbsp;۳ و تیتوس&nbsp;۱. اگرچه این شرایط برای ناظران نوشته شده، این حوزه‌های رشد برای هر ایماندار، از جمله زنان، کاربرد دارد. آنچه را که از قبل درباره‌ی خودت یا شخصی که شاگردسازی می‌کنی صادق است علامت بزن، و قدم‌های بعدی تو — همراه با منابع برای هر کدام — به‌طور خودکار نمایان خواهد شد.'

  addResource: {en:"add a resource", uk:"додати ресурс", de:"Ressource hinzufügen", es:"añadir un recurso", it:"aggiungi una risorsa", pl:"dodaj materiał", fa:"یک منبع اضافه کن"},
  footerNote: {
    en:'<b>How the links work:</b> a Bible reference opens Bible&nbsp;Gateway (ESV); a named resource opens a Google&nbsp;Drive search for it, so it’ll land on the right file(s) in your <code>AI/ClaudeCowork/iDisciple</code> folder as long as you’re signed into the Drive account that folder lives in — it’s a search, not always a single exact file, since a few areas map to a whole outline section rather than one document. Nothing is embedded directly in this page, since some material (Herschel Training Books, etc.) looks third-party. Items marked <span class="tbd">"add a resource"</span> don’t have an obvious match yet — a good next step is deciding what to point people to there. Matches marked <b>(verify)</b> are my best guess from filenames/outline and worth a second look. Being items throughout are grounded in 1&nbsp;Timothy&nbsp;3:1&ndash;13 and Titus&nbsp;1:5&ndash;9. Your progress is saved in this browser only — it isn’t shared or synced anywhere. <i>Resource names stay in English even in other languages, since they point to the real files in your Drive folder.</i>',
    uk:'<b>Як працюють посилання:</b> біблійне посилання відкриває Bible&nbsp;Gateway (ESV); названий ресурс відкриває пошук у Google&nbsp;Drive, щоб ти потрапив на потрібний файл(и) у своїй папці <code>AI/ClaudeCowork/iDisciple</code> — за умови, що ти увійшов у той обліковий запис Drive, де знаходиться ця папка. Це пошук, а не завжди один точний файл, оскільки деякі сфери відповідають цілому розділу плану, а не одному документу. Нічого не вбудовано безпосередньо на цю сторінку, оскільки деякі матеріали (наприклад, Herschel Training Books) виглядають як матеріали третіх сторін. Пункти, позначені як <span class="tbd">"додати ресурс"</span>, ще не мають очевидного відповідника — гарний наступний крок це вирішити, на що там варто вказати. Збіги, позначені <b>(verify)</b>, — це моє найкраще припущення на основі назв файлів чи плану і варті повторної перевірки. Пункти розділу «Буття» ґрунтуються на 1&nbsp;Тимофія&nbsp;3:1&ndash;13 та Титу&nbsp;1:5&ndash;9. Твій прогрес зберігається лише в цьому браузері — він нікуди не передається і не синхронізується. <i>Назви ресурсів залишаються англійською навіть в інших мовах, оскільки вони вказують на реальні файли у твоїй папці Drive.</i>',
    de:'<b>So funktionieren die Links:</b> Eine Bibelstelle öffnet Bible&nbsp;Gateway (ESV); eine benannte Ressource öffnet eine Google&nbsp;Drive-Suche dafür, sodass du bei der richtigen Datei bzw. den richtigen Dateien in deinem Ordner <code>AI/ClaudeCowork/iDisciple</code> landest — vorausgesetzt, du bist mit dem passenden Drive-Konto angemeldet. Es ist eine Suche, nicht immer eine einzelne exakte Datei, da manche Bereiche einem ganzen Gliederungsabschnitt statt einem Dokument entsprechen. Es ist nichts direkt eingebettet, da manches Material (z. B. Herschel Training Books) von Dritten stammen dürfte. Mit <span class="tbd">„Ressource hinzufügen"</span> markierte Punkte haben noch keine offensichtliche Entsprechung. Mit <b>(verify)</b> markierte Treffer sind meine beste Vermutung und verdienen einen zweiten Blick. Die „Sein"-Punkte gründen durchweg auf 1.&nbsp;Timotheus&nbsp;3,1&ndash;13 und Titus&nbsp;1,5&ndash;9. Dein Fortschritt wird nur in diesem Browser gespeichert. <i>Ressourcennamen bleiben auch in anderen Sprachen englisch, da sie auf die echten Dateien in deinem Drive-Ordner verweisen.</i>',
    es:'<b>Cómo funcionan los enlaces:</b> una referencia bíblica abre Bible&nbsp;Gateway (ESV); un recurso nombrado abre una búsqueda de Google&nbsp;Drive, así llegarás al archivo correcto en tu carpeta <code>AI/ClaudeCowork/iDisciple</code>, siempre que hayas iniciado sesión en esa cuenta de Drive. Es una búsqueda, no siempre un archivo exacto, ya que algunas áreas corresponden a toda una sección del esquema. Nada está incrustado directamente aquí, ya que algunos materiales (Herschel Training Books, etc.) parecen de terceros. Los elementos marcados <span class="tbd">"añadir un recurso"</span> aún no tienen una coincidencia obvia. Las coincidencias marcadas <b>(verify)</b> son mi mejor suposición y merecen revisión. Los elementos de "Ser" se basan en 1&nbsp;Timoteo&nbsp;3:1&ndash;13 y Tito&nbsp;1:5&ndash;9. Tu progreso se guarda solo en este navegador. <i>Los nombres de los recursos permanecen en inglés incluso en otros idiomas, ya que apuntan a los archivos reales de tu carpeta de Drive.</i>',
    it:'<b>Come funzionano i link:</b> un riferimento biblico apre Bible&nbsp;Gateway (ESV); una risorsa con nome apre una ricerca su Google&nbsp;Drive, così arriverai al file giusto nella tua cartella <code>AI/ClaudeCowork/iDisciple</code>, purché tu abbia effettuato l’accesso a quell’account Drive. È una ricerca, non sempre un unico file esatto, poiché alcune aree corrispondono a un’intera sezione dello schema. Niente è incorporato direttamente qui, poiché alcuni materiali (Herschel Training Books, ecc.) sembrano di terzi. Le voci contrassegnate <span class="tbd">"aggiungi una risorsa"</span> non hanno ancora una corrispondenza ovvia. Le corrispondenze contrassegnate <b>(verify)</b> sono la mia migliore ipotesi e meritano un secondo sguardo. Le voci di "Essere" si fondano su 1&nbsp;Timoteo&nbsp;3:1&ndash;13 e Tito&nbsp;1:5&ndash;9. I tuoi progressi sono salvati solo in questo browser. <i>I nomi delle risorse restano in inglese anche nelle altre lingue, poiché indicano i file reali nella tua cartella Drive.</i>',
    pl:'<b>Jak działają linki:</b> odniesienie biblijne otwiera Bible&nbsp;Gateway (ESV); nazwany materiał otwiera wyszukiwanie w Google&nbsp;Drive, dzięki czemu trafisz na właściwy plik (pliki) w swoim folderze <code>AI/ClaudeCowork/iDisciple</code> — o ile jesteś zalogowany na konto Drive, w którym znajduje się ten folder. To wyszukiwanie, nie zawsze pojedynczy dokładny plik, ponieważ niektóre obszary odpowiadają całej sekcji planu, a nie jednemu dokumentowi. Nic nie jest osadzone bezpośrednio na tej stronie, ponieważ część materiałów (np. Herschel Training Books) wygląda na pochodzące od osób trzecich. Pozycje oznaczone jako <span class="tbd">„dodaj materiał”</span> nie mają jeszcze oczywistego dopasowania — dobrym następnym krokiem jest ustalenie, co tam wskazać. Twój postęp jest zapisywany wyłącznie w tej przeglądarce — nigdzie nie jest udostępniany ani synchronizowany. <i>Nazwy materiałów pozostają w języku angielskim nawet w innych językach, ponieważ wskazują na rzeczywiste pliki w twoim folderze Drive.</i>',
    fa:'<b>لینک‌ها چگونه کار می‌کنند:</b> یک ارجاع کتاب‌مقدسی، Bible&nbsp;Gateway (نسخه ESV) را باز می‌کند؛ یک منبع نام‌برده‌شده، یک جست‌وجو در Google&nbsp;Drive باز می‌کند تا به فایل (یا فایل‌های) درست در پوشه‌ی <code>AI/ClaudeCowork/iDisciple</code> برسی — به شرطی که به همان حساب Drive وارد شده باشی که این پوشه در آن قرار دارد. این یک جست‌وجوست، نه همیشه یک فایل دقیق واحد، زیرا برخی حوزه‌ها به یک بخش کامل از طرح کلی مربوط می‌شوند نه یک سند. هیچ‌چیز مستقیماً در این صفحه جاسازی نشده، زیرا برخی مطالب (مانند Herschel Training Books) به نظر متعلق به منابع ثالث می‌رسند. مواردی که با عبارت <span class="tbd">«یک منبع اضافه کن»</span> مشخص شده‌اند هنوز تطابق روشنی ندارند — قدم بعدی خوب این است که مشخص کنی به چه چیزی باید اشاره کرد. پیشرفت تو فقط در همین مرورگر ذخیره می‌شود — در جای دیگری به اشتراک گذاشته یا همگام‌سازی نمی‌شود. <i>نام منابع حتی در زبان‌های دیگر نیز به انگلیسی باقی می‌مانند، زیرا به فایل‌های واقعی در پوشه‌ی Drive تو اشاره می‌کنند.</i>'
  }

function itemsFor(stageId, divisionId){
  return ITEMS.filter(function(it){ return it.stage===stageId && it.division===divisionId; });
}
function stagePct(stageId){
  var items = ITEMS.filter(function(it){ return it.stage===stageId; });
  if (!items.length) return 0;
  var done = items.filter(function(it){ return isChecked(it.id); }).length;
  return Math.round(done/items.length*100);
}

function renderNav(){
  var nav = document.getElementById("stageNav");
  nav.innerHTML = "";
  STAGES.forEach(function(s){
    var btn = document.createElement("button");
    btn.className = "stage-btn" + (s.id===currentStage ? " active" : "");
    var pct = stagePct(s.id);
    btn.innerHTML =
      '<span class="stage-ring" style="--pct:'+pct+'" data-pct="'+pct+'"></span>' +
      '<span class="stage-name">'+escapeHtml(trStage(s.id))+'</span>';
    btn.addEventListener("click", function(){ currentStage = s.id; renderAll(); });
    nav.appendChild(btn);
  });
}

function firstUnchecked(stageId, divisionId){
  var items = itemsFor(stageId, divisionId);
  for (var i=0;i<items.length;i++){ if(!isChecked(items[i].id)) return items[i]; }
  return null;
}

function renderNextSteps(){
  document.getElementById("stageLabelInline").textContent =
    "— " + trStage(currentStage);
  var grid = document.getElementById("nextGrid");
  grid.innerHTML = "";
  var anyOpen = false;
  DIVISIONS.forEach(function(div){
    var next = firstUnchecked(currentStage, div.id);
    var card = document.createElement("div");
    if (!next){
      card.className = "next-card all-done";
      card.textContent = fillTemplate(t("allDoneTemplate"), {division: trDivLabel(div.id)});
      grid.appendChild(card);
      return;
    }
    anyOpen = true;
    card.className = "next-card";
    card.style.setProperty("--card-color", div.color);
    var resHtml = next.r.map(function(line){ return resLineHtml(line); }).join("");
    card.innerHTML =
      '<div class="division">'+escapeHtml(trDivLabel(div.id))+' &middot; '+escapeHtml(trDivSub(div.id))+'</div>' +
      '<div class="item-title">'+escapeHtml(trTitle(next.title))+'</div>' +
      '<div class="res">'+resHtml+'</div>' + ccButtonHtml(next.title) +
      '<label class="done-check"><input type="checkbox" class="chk" data-id="'+next.id+'"> '+escapeHtml(t("markDone"))+'</label>';
    grid.appendChild(card);
  });
  grid.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener("change", function(){
      setChecked(cb.getAttribute("data-id"), cb.checked);
      renderAll();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// A resource line either IS a Bible reference ("Titus 1:9"), or names something
// findable in the iDisciple Google Drive folder. This maps a line to a URL —
// Bible Gateway for a reference, a Drive search for a named resource — or
// returns null for plain notes ("add a resource") that aren't a real target yet.
var BIBLE_LINE_RE = /^[1-3]?\s?[A-Za-z]+(?:\s[A-Za-z]+)?\s\d{1,3}:\d{1,3}(?:[–-]\d{1,3})?$/;
var DRIVE_RULES = [
  {test:/Be Ye Holy/i, q:"BeYeHoly"},
  {test:/Holy Spirit.*study series/i, q:"HolySpirit"},
  {test:/The Church.*study series/i, q:"TheChurch"},
  {test:/The GC.*study series/i, q:"TheGC"},
  {test:/God's Values/i, q:"GodsValues"},
  {test:/The Word.*study series/i, q:"TheWord"},
  {test:/Witness.*study series/i, q:"Witness"},
  {test:/Serving.*study series/i, q:"Serving"},
  {test:/Building Convictions.*[“]([^”]+)[”]/i, qFrom:1},
  {test:/Building Convictions series/i, q:"Building Convictions"},
  {test:/Herschel Training/i, q:"basics-book"},
  {test:/Great Commission Workbook|GCW2018/i, q:"GCW2018"},
  {test:/Beginning in Christ.*booklet/i, q:"Beginn"},
  // A resource line ending "(ExactFile.pdf)" or "(nlbs1_2.doc)" names one specific lesson
  // file in the NewLifeStudies-Kern folder — search for that file directly rather than
  // falling through to the generic NLBS search below, which surfaces every NLBS-related
  // file in the whole Drive (including old duplicates) instead of the one lesson meant.
  {test:/\(([\w]+\.(?:PDF|pdf|doc|docx))\)\s*$/, qFrom:1},
  // A trailing "(SeriesName)" with no extension names a whole named series (e.g. "(Maturity)",
  // "(TheChurch)") when a citation spans more than one file in that series — narrows the
  // search to that series instead of every "New Life Bible Studies" file in Drive.
  {test:/\(([A-Za-z]+)\)\s*$/, qFrom:1},
  {test:/New Life Bible Studies/i, q:"NLBS"}
];
function resourceLink(text){
  var t = text.trim();
  if (BIBLE_LINE_RE.test(t)){
    return "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(t) + "&version=ESV";
  }
  for (var i=0;i<DRIVE_RULES.length;i++){
    var rule = DRIVE_RULES[i];
    var m = t.match(rule.test);
    if (m){
      var q = rule.qFrom ? m[rule.qFrom] : rule.q;
      return "https://drive.google.com/drive/search?q=" + encodeURIComponent(q);
    }
  }
  return null;
}
function resLineHtml(line, extraClass){
  var href = resourceLink(line);
  var cls = "res-line" + (extraClass ? " " + extraClass : "");
  var displayText = /^add a resource$/i.test(line) ? t("addResource") : line;
  var body = escapeHtml(displayText);
  if (href){
    return '<div class="'+cls+'"><a href="'+href+'" target="_blank" rel="noopener noreferrer">'+body+'</a></div>';
  }
  return '<div class="'+cls+'">'+body+'</div>';
}

function renderColumns(){
  var wrap = document.getElementById("columns");
  wrap.innerHTML = "";
  DIVISIONS.forEach(function(div){
    var col = document.createElement("div");
    col.className = "col " + div.id;
    var items = itemsFor(currentStage, div.id);
    var doneCount = items.filter(function(it){return isChecked(it.id);}).length;
    var head = document.createElement("div");
    head.className = "col-head";
    head.innerHTML = '<div class="label" style="color:'+div.color+'">'+escapeHtml(trDivLabel(div.id))+'</div>' +
      '<div class="sub">'+escapeHtml(trDivSub(div.id))+' &middot; '+escapeHtml(fillTemplate(t("doneOfTemplate"), {done:doneCount, total:items.length}))+'</div>';
    col.appendChild(head);
    var body = document.createElement("div");
    body.className = "col-body";
    items.forEach(function(it){
      var row = document.createElement("div");
      row.className = "item" + (isChecked(it.id) ? " checked" : "");
      var resHtml = it.r.map(function(line){
        var tbd = /^add a resource$/i.test(line);
        return resLineHtml(line, tbd ? "tbd" : "");
      }).join("");
      row.innerHTML =
        '<div class="item-row">' +
          '<input type="checkbox" class="chk" data-id="'+it.id+'" '+(isChecked(it.id)?"checked":"")+'>' +
          '<div class="item-title-row">'+escapeHtml(trTitle(it.title))+'</div>' +
          '<div class="caret">&#9656;</div>' +
        '</div>' +
        '<div class="item-detail">'+resHtml+ccButtonHtml(it.title)+'</div>';
      var titleRow = row.querySelector(".item-row");
      titleRow.addEventListener("click", function(e){
        if (e.target.classList.contains("chk")) return;
        row.classList.toggle("open");
      });
      var cb = row.querySelector(".chk");
      cb.addEventListener("click", function(e){ e.stopPropagation(); });
      cb.addEventListener("change", function(){
        setChecked(it.id, cb.checked);
        renderAll();
      });
      body.appendChild(row);
    });
    col.appendChild(body);
    wrap.appendChild(col);
  });
}

function renderOverview(){
  var table = document.getElementById("overviewTable");
  var theadHtml = '<thead><tr><th class="corner"></th>' +
    STAGES.map(function(s){ return '<th data-stage="'+s.id+'">'+escapeHtml(trStage(s.id))+'</th>'; }).join("") +
    '</tr></thead>';
  var bodyRows = DIVISIONS.map(function(div){
    var cells = STAGES.map(function(s){
      var items = itemsFor(s.id, div.id);
      var itemsHtml = items.map(function(it){
        return '<label class="mini-item'+(isChecked(it.id)?" checked":"")+'">' +
          '<input type="checkbox" class="chk" data-id="'+it.id+'" '+(isChecked(it.id)?"checked":"")+'>' +
          '<span>'+escapeHtml(trTitle(it.title))+'</span></label>';
      }).join("");
      return '<td>'+itemsHtml+'</td>';
    }).join("");
    return '<tr><th class="row-label" style="border-left:4px solid '+div.color+'; color:'+div.color+'">'+escapeHtml(trDivLabel(div.id))+'</th>'+cells+'</tr>';
  }).join("");
  table.innerHTML = theadHtml + '<tbody>'+bodyRows+'</tbody>';

  table.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener("click", function(e){ e.stopPropagation(); });
    cb.addEventListener("change", function(){
      setChecked(cb.getAttribute("data-id"), cb.checked);
      renderAll();
    });
  });
  table.querySelectorAll('thead th[data-stage]').forEach(function(th){
    th.addEventListener("click", function(){
      currentStage = th.getAttribute("data-stage");
      renderAll();
      var nav = document.getElementById("stageNav");
      if (nav) nav.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function renderAll(){
  renderViews();
  renderOverview();
  renderNav();
  renderNextSteps();
  renderColumns();
  renderCourses();
}

function fileFor(s, L){
  if (!s.f) return null;
  if (s.f[L]) return {name:s.f[L], lang:L, fallback:false};
  if (s.f.en) return {name:s.f.en, lang:"en", fallback:(L !== "en")};
  return null;
}
function langStats(c){
  var out = {};
  LANGS.forEach(function(L){
    var n = 0;
    c.groups.forEach(function(g){ g.sessions.forEach(function(s){ if (s.f && s.f[L]) n++; }); });
    out[L] = n;
  });
  return out;
}
function coursesCovering(title){
  var list = [];
  COURSES.forEach(function(c){
    var ss = c.an.by[title];
    if (ss) list.push({course:c, sessions:ss});
  });
  return list;
}
function ccButtonHtml(title){
  var n = coursesCovering(title).length;
  if (!n) return "";
  return '<button type="button" class="cc-btn" data-item="'+escapeHtml(title)+'">' +
    escapeHtml(fillTemplate(t("ccBtn"), {n:n})) + '</button>';
}

function applyCourseI18n(){
  var a = document.getElementById("tabPathway"); if (a) a.textContent = t("tabPathway");
  var b = document.getElementById("tabCourses"); if (b) b.textContent = t("tabCourses");
}

function courseMatch(c){
  var by = c.an.by;
  if (filt.item) return by[filt.item] ? {count:by[filt.item].length} : null;
  var cnt = 0;
  Object.keys(by).forEach(function(title){
    var it = ITEM_BY_TITLE[title]; if (!it) return;
    if ((filt.stage === "all" || it.stage === filt.stage) && (filt.div === "all" || it.division === filt.div)) cnt++;
  });
  return cnt > 0 ? {count:cnt} : null;
}

function gridHtml(c){
  var by = c.an.by, sel = openCell[c.id];
  var filtering = (filt.stage !== "all" || filt.div !== "all");
  var h = '<table class="cov-grid"><thead><tr><th></th>' +
    STAGES.map(function(s){ return '<th>'+escapeHtml(trStage(s.id))+'</th>'; }).join("") +
    '</tr></thead><tbody>';
  DIVISIONS.forEach(function(d){
    h += '<tr><th class="cov-row" style="color:'+d.color+'">'+escapeHtml(trDivLabel(d.id))+'</th>';
    STAGES.forEach(function(s){
      var items = itemsFor(s.id, d.id);
      var cov = items.filter(function(it){ return by[it.title]; }).length;
      var f = items.length ? cov/items.length : 0;
      var k = s.id + "|" + d.id;
      var hl = filtering && (filt.stage === "all" || filt.stage === s.id) && (filt.div === "all" || filt.div === d.id);
      h += '<td><button type="button" class="cov-cell'+(cov ? "" : " empty")+(sel === k ? " sel" : "")+(hl ? " hl" : "")+'"' +
        ' style="--cell-color:'+d.color+';--f:'+f.toFixed(2)+'" data-act="cell" data-course="'+c.id+'" data-cell="'+k+'"' +
        (cov ? "" : " disabled") + '><b>'+cov+'</b><span>/'+items.length+'</span></button></td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

function sessLabels(c, title){
  var ss = c.an.by[title] || [];
  if (!ss.length) return escapeHtml(t("wholeCourse"));
  return ss.map(function(s){ return escapeHtml(s.n); }).join(", ");
}

function cellDetailHtml(c){
  var key = openCell[c.id];
  if (!key) return "";
  var p = key.split("|");
  var items = itemsFor(p[0], p[1]);
  var by = c.an.by;
  var hit = items.filter(function(it){ return by[it.title]; });
  var miss = items.filter(function(it){ return !by[it.title]; });
  var h = '<div class="cell-detail"><div class="cell-detail-title">' +
    escapeHtml(trStage(p[0])) + ' · ' + escapeHtml(trDivLabel(p[1])) + '</div><ul class="cell-list">';
  hit.forEach(function(it){
    var done = isChecked(it.id);
    h += '<li class="'+(done ? "done" : "")+'"><span class="tick">'+(done ? "&#10003;" : "")+'</span>' +
      '<span class="ct">'+escapeHtml(trTitle(it.title))+'</span> <span class="cov-sess">'+sessLabels(c, it.title)+'</span></li>';
  });
  h += '</ul>';
  if (miss.length){
    h += '<div class="cell-miss"><b>'+escapeHtml(t("notCoveredHere"))+'</b> ' +
      miss.map(function(it){ return escapeHtml(trTitle(it.title)); }).join(" · ") + '</div>';
  }
  return h + '</div>';
}

function sessionsHtml(c, eff){
  var only = filt.item;
  var h = "";
  c.groups.forEach(function(g){
    var ss = g.sessions.filter(function(s){ return !only || s.items.indexOf(only) !== -1; });
    if (!ss.length) return;
    if (g.name) h += '<div class="sess-group">'+escapeHtml(g.name)+'</div>';
    h += '<ul class="sess-list">';
    ss.forEach(function(s){
      var file = fileFor(s, eff);
      var title = escapeHtml(s.title) + (s.pg ? ' <span class="pg">'+escapeHtml(s.pg)+'</span>' : "");
      var body;
      if (file){
        body = '<a href="'+driveFileUrl(file.name)+'" target="_blank" rel="noopener noreferrer">'+title+'</a>' +
          (file.fallback ? ' <span class="lang-badge">'+escapeHtml(LANG_NAMES[file.lang])+'</span>' : "");
      } else {
        body = '<span class="nofile">'+title+'</span> <span class="lang-badge off">'+escapeHtml(t("noFileYet"))+'</span>';
      }
      var covered = s.items.map(function(x){ return escapeHtml(trTitle(x)); }).join(" · ");
      h += '<li class="sess'+(only && s.items.indexOf(only) !== -1 ? " hit" : "")+'">' +
        '<span class="sn">'+escapeHtml(s.n)+'</span>' +
        '<span class="sbody"><span class="st">'+body+'</span>' +
        (covered ? '<span class="sitems">'+covered+'</span>' : "") + '</span></li>';
    });
    h += '</ul>';
  });
  return h;
}

function courseCardHtml(c, m, eff){
  var by = c.an.by;
  var stats = langStats(c);
  var total = c.an.withFile;
  var chips = LANGS.filter(function(L){ return stats[L] > 0; }).map(function(L){
    var full = stats[L] === total;
    return '<span class="lchip'+(full ? "" : " part")+(L === eff ? " eff" : "")+'">' +
      '<span class="flag">'+LANG_FLAGS[L]+'</span> '+LANG_NAMES[L]+(full ? "" : ' '+stats[L]+'/'+total)+'</span>';
  }).join("");
  var warn = "";
  if (eff !== "en"){
    if (stats[eff] === 0) warn = fillTemplate(t("notInLang"), {lang:LANG_NAMES[eff]});
    else if (stats[eff] < total) warn = fillTemplate(t("partInLang"), {lang:LANG_NAMES[eff], n:stats[eff], total:total});
  }
  var covered = Object.keys(by).filter(function(x){ return ITEM_BY_TITLE[x]; }).length;
  var openN = ITEMS.filter(function(it){ return it.stage === currentStage && by[it.title] && !isChecked(it.id); }).length;
  var isOpen = !!openCourse[c.id] || !!filt.item;
  var sessLine = filt.item
    ? fillTemplate(t("sessionsCount"), {n:m.count})
    : fillTemplate(t("sessionsCount"), {n:c.an.n});
  var h = '<article class="course-card" id="course-'+c.id+'">' +
    '<div class="course-head"><div class="course-id"><h3>'+escapeHtml(c.title)+'</h3>' +
    '<div class="course-by">'+escapeHtml(c.by)+(c.approx ? ' · <span class="lang-badge off">'+escapeHtml(t("approxBadge"))+'</span>' : "")+'</div></div>' +
    '<div class="course-langs" title="'+escapeHtml(t("availIn"))+'"><span class="avail">'+escapeHtml(t("availIn"))+'</span>'+chips+'</div></div>' +
    (warn ? '<div class="lang-warn">'+escapeHtml(warn)+'</div>' : "") +
    '<p class="course-blurb">'+escapeHtml(c.blurb)+'</p>' +
    '<div class="cov-wrap">'+gridHtml(c)+'</div>' +
    '<div class="cov-summary"><b>'+escapeHtml(fillTemplate(t("coversTotal"), {c:covered, t:ITEMS.length}))+'</b>' +
    (openN ? ' · '+escapeHtml(fillTemplate(t("coversOpen"), {n:openN, stage:trStage(currentStage)})) : "") + '</div>' +
    cellDetailHtml(c) +
    '<button type="button" class="sess-toggle" data-act="toggle" data-course="'+c.id+'" aria-expanded="'+(isOpen ? "true" : "false")+'">' +
    '<span class="caret">&#9656;</span> '+escapeHtml(isOpen ? t("hideSessions") : t("showSessions"))+' &middot; '+escapeHtml(sessLine)+'</button>' +
    (isOpen ? '<div class="sess-wrap">'+sessionsHtml(c, eff)+'</div>' : "") +
    '</article>';
  return h;
}

function renderCourses(){
  var host = document.getElementById("coursesView");
  if (!host) return;
  var eff = effMatLang();
  var h = '<div class="section-title">'+escapeHtml(t("coursesTitle"))+'</div>' +
    '<p class="overview-hint">'+escapeHtml(t("coursesHint"))+'</p>';

  h += '<div class="course-controls">';
  if (filt.item){
    h += '<div class="item-banner"><span>'+escapeHtml(fillTemplate(t("coursesCovering"), {item:trTitle(filt.item)}))+'</span>' +
      '<button type="button" class="fchip" data-act="clear-item">'+escapeHtml(t("clearFilter"))+' &times;</button></div>';
  } else {
    h += '<div class="frow"><span class="flabel">'+escapeHtml(t("fStage"))+'</span>' +
      '<button type="button" class="fchip'+(filt.stage === "all" ? " active" : "")+'" data-act="fstage" data-v="all">'+escapeHtml(t("fAll"))+'</button>' +
      STAGES.map(function(s){
        return '<button type="button" class="fchip'+(filt.stage === s.id ? " active" : "")+'" data-act="fstage" data-v="'+s.id+'">'+escapeHtml(trStage(s.id))+'</button>';
      }).join("") + '</div>';
    h += '<div class="frow"><span class="flabel">'+escapeHtml(t("fArea"))+'</span>' +
      '<button type="button" class="fchip'+(filt.div === "all" ? " active" : "")+'" data-act="fdiv" data-v="all">'+escapeHtml(t("fAll"))+'</button>' +
      DIVISIONS.map(function(d){
        return '<button type="button" class="fchip'+(filt.div === d.id ? " active" : "")+'" data-act="fdiv" data-v="'+d.id+'">'+escapeHtml(trDivLabel(d.id))+'</button>';
      }).join("") + '</div>';
  }
  h += '<div class="frow"><label class="flabel" for="matLangSel">'+escapeHtml(t("matLangLabel"))+'</label>' +
    '<select id="matLangSel" class="msel"><option value="auto"'+(matLang === "auto" ? " selected" : "")+'>'+escapeHtml(t("matLangAuto"))+'</option>' +
    LANGS.map(function(L){ return '<option value="'+L+'"'+(matLang === L ? " selected" : "")+'>'+LANG_NAMES[L]+'</option>'; }).join("") +
    '</select></div>';
  h += '</div>';

  var rows = [];
  COURSES.forEach(function(c, i){
    var m = courseMatch(c);
    if (m) rows.push({c:c, m:m, i:i});
  });
  var filtering = filt.item || filt.stage !== "all" || filt.div !== "all";
  if (filtering) rows.sort(function(a, b){ return (b.m.count - a.m.count) || (a.i - b.i); });

  if (!rows.length){
    h += '<div class="no-courses">'+escapeHtml(t("noCourses"))+'</div>';
  } else {
    h += '<div class="course-list">' + rows.map(function(r){ return courseCardHtml(r.c, r.m, eff); }).join("") + '</div>';
  }
  host.innerHTML = h;
}

(function initCoursesEvents(){
  var host = document.getElementById("coursesView");
  if (host){
    host.addEventListener("click", function(e){
      var el = e.target.closest("[data-act]");
      if (!el || !host.contains(el)) return;
      var act = el.getAttribute("data-act");
      if (act === "toggle"){
        var id = el.getAttribute("data-course");
        openCourse[id] = !openCourse[id];
      } else if (act === "cell"){
        var cid = el.getAttribute("data-course"), cell = el.getAttribute("data-cell");
        openCell[cid] = (openCell[cid] === cell) ? null : cell;
      } else if (act === "fstage"){ filt.stage = el.getAttribute("data-v");
      } else if (act === "fdiv"){ filt.div = el.getAttribute("data-v");
      } else if (act === "clear-item"){ filt.item = null;
      } else { return; }
      renderCourses();
    });
    host.addEventListener("change", function(e){
      if (e.target && e.target.id === "matLangSel"){
        matLang = e.target.value;
        try { localStorage.setItem(MATLANG_KEY, matLang); } catch(err) {}
        renderCourses();
      }
    });
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".cc-btn") : null;
    if (!b) return;
    filt.item = b.getAttribute("data-item");
    filt.stage = "all"; filt.div = "all";
    setView("courses");
    var tabsEl = document.getElementById("viewTabs");
    if (tabsEl && tabsEl.scrollIntoView) tabsEl.scrollIntoView({behavior:"smooth", block:"start"});
  });
  var tabsNav = document.getElementById("viewTabs");
  if (tabsNav){
    tabsNav.addEventListener("click", function(e){
      var b = e.target.closest("[data-view]");
      if (!b) return;
      if (b.getAttribute("data-view") !== "courses") filt.item = null;
      setView(b.getAttribute("data-view"));
    });
  }
})();

function setView(v){
  view = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch(e) {}
  renderAll();
}
function renderViews(){
  var p = document.getElementById("viewPathway"), c = document.getElementById("coursesView");
  if (p) p.hidden = (view !== "pathway");
  if (c) c.hidden = (view !== "courses");
  document.querySelectorAll("#viewTabs [data-view]").forEach(function(b){
    var on = b.getAttribute("data-view") === view;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
}

    text: {

      uk:"Відкрий «Шлях» і познач те, що вже є правдою.\nПрочитай наступні кроки — або знайди в «Курсах» цілу студію, яку можна пройти разом.\nУзгодьте кроки й запишіть їх у протоколі зустрічі з датою.\nЗавантажте PDF і поділіться ним.\nНаступного разу повернися й познач, що виконано.",
      de:"Öffne „Weg“ und hake ab, was schon zutrifft.\nLies die nächsten Schritte — oder suche unter „Kurse“ eine ganze Studie zum gemeinsamen Durcharbeiten.\nEinigt euch auf die Schritte und tragt sie mit Datum ins Sitzungsprotokoll ein.\nLade das PDF herunter und teile es.\nKomm beim nächsten Mal wieder und hake ab, was erledigt wurde.",
      es:"Abre «Camino» y marca lo que ya es cierto.\nLee los próximos pasos, o busca en «Cursos» un estudio completo para hacer juntos.\nAcuerden los pasos y anótenlos en el Registro de la Sesión con una fecha.\nDescarga el PDF y compártelo.\nLa próxima vez, vuelve y marca lo que se hizo.",
      it:"Apri «Percorso» e spunta ciò che è già vero.\nLeggi i prossimi passi, oppure cerca in «Corsi» uno studio completo da fare insieme.\nConcordate i passi e scriveteli nella Scheda dell’Incontro con una data.\nScarica il PDF e condividilo.\nLa volta successiva, torna e spunta ciò che è stato fatto.",
      pl:"Otwórz „Ścieżkę” i zaznacz to, co jest już prawdą.\nPrzeczytaj kolejne kroki — albo poszukaj w „Kursach” całego studium do przejścia razem.\nUzgodnijcie kroki i zapiszcie je w protokole spotkania z datą.\nPobierz PDF i podziel się nim.\nNastępnym razem wróć i zaznacz, co zostało zrobione.",
      fa:"«مسیر» را باز کن و آنچه از قبل صادق است را علامت بزن.\nقدم‌های بعدی را بخوان — یا در «دوره‌ها» یک مطالعه‌ی کامل برای گذراندن با هم پیدا کن.\nروی قدم‌ها توافق کنید و آن‌ها را با تاریخ در گزارش جلسه بنویسید.\nPDF را دانلود و به‌اشتراک بگذار.\nدفعه‌ی بعد برگرد و آنچه انجام شده را علامت بزن."
    },
    list: true
  }
};

// target: CSS selector (null = centred card). view: view this step needs. grow: highlight the parent.
var TOUR_STEPS = [
  {id:"welcome"},
  {id:"lang",     target:"#langRow"},
  {id:"tabs",     target:"#viewTabs"},
  {id:"record",   target:"#recordCard"},
  {id:"pdf",      target:"#printBtn"},
  {id:"overview", target:".overview-wrap .table-scroll", view:"pathway"},
  {id:"stagebar", target:"#stageNav", view:"pathway"},
  {id:"next",     target:"#nextGrid", view:"pathway"},
  {id:"res",      target:"#nextGrid .res", view:"pathway"},
  {id:"cc",       target:"#nextGrid .cc-btn", view:"pathway", grow:true},
  {id:"items",    target:"#columns", view:"pathway"},
  {id:"courses",  target:"#coursesView .course-controls", view:"courses"},
  {id:"grid",     target:"#coursesView .cov-grid", view:"courses"},
  {id:"matlang",  target:"#matLangSel", view:"courses", grow:true},
  {id:"data"},
  {id:"flow"}
];

var tour = {active:false, list:[], i:0, prevView:null, els:null};

function tt(id, field){
  var row = TOUR_TXT[id] && TOUR_TXT[id][field];
  if (!row) return "";
  return row[currentLang] || row.en;
}

function tourBuild(){
  if (tour.els) return tour.els;
  var shield = document.createElement("div");
  shield.id = "tourShield"; shield.className = "tour-shield"; shield.hidden = true;
  var spot = document.createElement("div");
  spot.id = "tourSpot"; spot.className = "tour-spot"; spot.hidden = true;
  var pop = document.createElement("div");
  pop.id = "tourPop"; pop.className = "tour-pop"; pop.hidden = true;
  pop.setAttribute("role", "dialog"); pop.setAttribute("aria-modal", "true"); pop.setAttribute("aria-labelledby", "tourTitle");
  pop.innerHTML =
    '<div class="tour-top"><span class="tour-count" id="tourCount"></span>' +
    '<button type="button" class="tour-x" id="tourX"></button></div>' +
    '<h4 class="tour-title" id="tourTitle"></h4>' +
    '<div class="tour-text" id="tourText"></div>' +
    '<div class="tour-nav"><button type="button" class="tour-link" id="tourSkip"></button><span class="tour-sp"></span>' +
    '<button type="button" class="tour-sec" id="tourBack"></button>' +
    '<button type="button" class="tour-pri" id="tourNext"></button></div>';
  document.body.appendChild(shield);
  document.body.appendChild(spot);
  document.body.appendChild(pop);
  tour.els = {shield:shield, spot:spot, pop:pop};
  pop.querySelector("#tourX").addEventListener("click", tourClose);
  pop.querySelector("#tourSkip").addEventListener("click", tourClose);
  pop.querySelector("#tourBack").addEventListener("click", function(){ tourGo(-1); });
  pop.querySelector("#tourNext").addEventListener("click", function(){ tourGo(1); });
  window.addEventListener("resize", function(){ if (tour.active) tourPlace(); });
  return tour.els;
}

function tourStart(){
  var els = tourBuild();
  try { localStorage.setItem(TOUR_KEY, "1"); } catch(e) {}
  tourHideHint();
  tour.prevView = view;
  filt.item = null; filt.stage = "all"; filt.div = "all";
  tour.list = TOUR_STEPS.filter(function(s){ return !s.target || document.querySelector(s.target); });
  tour.i = 0;
  tour.active = true;
  els.shield.hidden = false;
  tourShow();
}

function tourClose(){
  if (!tour.active) return;
  tour.active = false;
  var els = tour.els;
  els.shield.hidden = true; els.spot.hidden = true; els.pop.hidden = true;
  if (tour.prevView && tour.prevView !== view) setView(tour.prevView); else renderAll();
  try { window.scrollTo(0, 0); } catch(e) {}
}

function tourGo(d){
  var n = tour.i + d;
  if (n < 0) return;
  if (n >= tour.list.length){ tourClose(); return; }
  tour.i = n;
  tourShow();
}

function tourShow(){
  var st = tour.list[tour.i];
  if (st.view && st.view !== view) setView(st.view);
  var els = tour.els, pop = els.pop;
  document.getElementById("tourCount").textContent = fillTemplate(t("tourOf"), {n:tour.i + 1, total:tour.list.length});
  document.getElementById("tourTitle").textContent = tt(st.id, "title");
  var body = tt(st.id, "text");
  var tx = document.getElementById("tourText");
  if (TOUR_TXT[st.id].list){
    tx.innerHTML = '<ol>' + body.split("\n").map(function(l){ return '<li>'+escapeHtml(l)+'</li>'; }).join("") + '</ol>';
  } else {
    tx.textContent = body;
  }
  var last = tour.i === tour.list.length - 1;
  document.getElementById("tourX").setAttribute("aria-label", t("tourClose"));
  document.getElementById("tourX").innerHTML = "&times;";
  document.getElementById("tourSkip").textContent = t("tourSkip");
  document.getElementById("tourSkip").hidden = last;
  document.getElementById("tourBack").textContent = t("tourBack");
  document.getElementById("tourBack").disabled = (tour.i === 0);
  document.getElementById("tourNext").textContent = last ? t("tourDone") : t("tourNext");
  pop.hidden = false;
  // let the view switch re-render settle, then scroll and place
  setTimeout(function(){
    if (!tour.active) return;
    tourScrollTo(st);
    tourPlace();
    var nb = document.getElementById("tourNext"); if (nb && nb.focus) nb.focus({preventScroll:true});
  }, 40);
}

function tourTarget(st){
  if (!st.target) return null;
  var el = document.querySelector(st.target);
  if (el && st.grow && el.parentElement) el = el.parentElement;
  return el;
}

function tourScrollTo(st){
  var el = tourTarget(st);
  if (!el || !el.scrollIntoView) { try { window.scrollTo(0, 0); } catch(e) {} return; }
  var r = el.getBoundingClientRect();
  var tall = r.height > window.innerHeight * 0.5;
  el.scrollIntoView({block: (tall || window.innerWidth < 600) ? "start" : "center", behavior:"auto"});
}

function tourPlace(){
  if (!tour.active) return;
  var st = tour.list[tour.i];
  var els = tour.els, spot = els.spot, pop = els.pop;
  var el = tourTarget(st);
  var vw = window.innerWidth, vh = window.innerHeight;
  var sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
  pop.classList.remove("center", "dock");
  pop.style.left = ""; pop.style.top = ""; pop.style.right = ""; pop.style.bottom = "";
  if (!el){
    spot.hidden = true;
    pop.classList.add("center");
    return;
  }
  var r = el.getBoundingClientRect();
  var pad = 6;
  spot.hidden = false;
  spot.style.left = (r.left + sx - pad) + "px";
  spot.style.top = (r.top + sy - pad) + "px";
  spot.style.width = (r.width + pad*2) + "px";
  spot.style.height = (r.height + pad*2) + "px";
  var popH = pop.offsetHeight, popW = pop.offsetWidth;
  var tall = r.height > vh * 0.5;
  if (vw < 600 || tall){
    pop.classList.add("dock");
    return;
  }
  var below = r.bottom + 14 + popH <= vh;
  var above = r.top - 14 - popH >= 0;
  var top;
  if (below) top = r.bottom + sy + 14;
  else if (above) top = r.top + sy - 14 - popH;
  else { pop.classList.add("dock"); return; }
  var left = r.left + sx;
  if (left + popW > sx + vw - 12) left = sx + vw - 12 - popW;
  if (left < sx + 12) left = sx + 12;
  pop.style.top = top + "px";
  pop.style.left = left + "px";
}

function tourHideHint(){
  var h = document.getElementById("tourHint");
  if (h) h.hidden = true;
}
function applyTourI18n(){
  var b = document.getElementById("tourBtn");
  if (b) b.textContent = "❓ " + t("tourBtn");
  var ht = document.getElementById("tourHintText");
  if (ht) ht.textContent = t("tourHint");
  var hx = document.getElementById("tourHintX");
  if (hx) hx.setAttribute("aria-label", t("tourClose"));
}

var TOUR_KEY = "discipling-pathway-tour-v1";
(function initTour(){
  var seen = false;
  try { seen = !!localStorage.getItem(TOUR_KEY); } catch(e) {}
  var btn = document.getElementById("tourBtn");
  var hint = document.getElementById("tourHint");
  if (hint) hint.hidden = seen;
  if (btn) btn.addEventListener("click", tourStart);
  var hint2 = document.getElementById("tourHintText");
  if (hint2) hint2.addEventListener("click", tourStart);
  var hx = document.getElementById("tourHintX");
  if (hx) hx.addEventListener("click", function(){
    try { localStorage.setItem(TOUR_KEY, "1"); } catch(e) {}
    tourHideHint();
  });
  document.addEventListener("keydown", function(e){
    if (!tour.active) return;
    var rtl = RTL_LANGS.indexOf(currentLang) !== -1;
    if (e.key === "Escape"){ e.preventDefault(); tourClose(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); tourGo(rtl ? -1 : 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); tourGo(rtl ? 1 : -1); }
  });
})();

// ---- session record card (name/date fields + print) ----
var RECORD_KEY = "discipling-pathway-record-v1";
var RECORD_FIELDS = ["rfDisciple","rfDiscipler","rfDate","rfNextSteps","rfDueDate"];
(function initRecordCard(){
  var saved = {};
  try {
    var raw = localStorage.getItem(RECORD_KEY);
    if (raw) saved = JSON.parse(raw) || {};
  } catch(e) { saved = {}; }

  RECORD_FIELDS.forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    if (saved[id] != null) el.value = saved[id];
    el.addEventListener("input", function(){
      saved[id] = el.value;
      try { localStorage.setItem(RECORD_KEY, JSON.stringify(saved)); } catch(e) {}
    });
  });

  var printBtn = document.getElementById("printBtn");
  var statusEl = document.getElementById("printStatus");
  function setStatus(msg, isError){
    if (!statusEl) return;
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("error", !!isError);
  }
  if (printBtn){
    printBtn.addEventListener("click", function(){
      generatePdf().catch(function(err){
        console.error(err);
        setStatus(t("statusRetry"), true);
        printBtn.disabled = false;
        printBtn.textContent = t("btnDownload");
      });
    });
  }

  async function generatePdf(){
    if (typeof html2canvas === "undefined" || !window.jspdf){
      setStatus(t("statusToolsFailed"), true);
      return;
    }
    printBtn.disabled = true;
    printBtn.textContent = t("btnPreparing");
    setStatus(t("statusRendering"));

    var target = document.querySelector(".wrap");
    var bg = getComputedStyle(document.body).backgroundColor;
    var canvas = await html2canvas(target, {
      scale:2, backgroundColor:bg, useCORS:true,
      ignoreElements: function(el){ return el.id === "langRow" || el.id === "viewTabs" || el.id === "tourShield" || el.id === "tourSpot" || el.id === "tourPop"; }
    });

    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({unit:"pt", format:"a4"});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgWidth = pageWidth;
    var imgHeight = canvas.height * imgWidth / canvas.width;
    var imgData = canvas.toDataURL("image/png");

    var heightLeft = imgHeight;
    var position = 0;
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position -= pageHeight;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    var blob = pdf.output("blob");
    var name = (document.getElementById("rfDisciple") || {}).value || "";
    var filename = "iDisciple" + (name ? "-" + name.replace(/[^a-z0-9]+/gi,"-") : "") + ".pdf";

    setStatus(t("statusWaiting"));
    var downloads = await (window.claude ? window.claude.use("downloads") : null);
    printBtn.disabled = false;
    printBtn.textContent = t("btnDownload");
    if (!downloads){
      // Outside claude.ai (e.g. GitHub Pages): ordinary browser download.
      try {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        setStatus(t("statusSaved"));
      } catch(err){
        setStatus(t("statusUnavailable"), true);
      }
      return;
    }
    try {
      await downloads.save({filename: filename, data: blob});
      setStatus(t("statusSaved"));
    } catch(err){
      if (err && err.code === "declined"){
        setStatus("");
      } else {
        setStatus(t("statusRetry") + " (" + (err && err.code || "?") + ")", true);
      }
    }
  }
})();

applyStaticI18n();
renderAll();
})();
</script>
